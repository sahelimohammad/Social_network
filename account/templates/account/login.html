
{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
<title>Login</title>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="img js-fullheight" style="background-image: url({% static 'images/bg.jpg' %});">
    <div >
        {% include 'inc/message.html'%}

    </div>


<section class="ftco-section">
<div class="container">
<div class="row justify-content-center">
<div class="col-md-6 text-center mb-5">
<h2 class="heading-section">Login</h2>
</div>
</div>
<div class="row justify-content-center">
<div class="col-md-6 col-lg-4">
<div class="login-wrap p-0">
<a href="{% url 'account:user_register' %}" type="submit" class="form-control btn btn-primary submit px-3"><h5 class="mb-4 text-center">Dont have an account?</h5></a>
<br>
<br>
    




<form action="" method="post" class="signin-form" novalidate>

    {% csrf_token %}

    <div class="form-group">
        {{form.as_p}}


    <input type="submit" class="form-control btn btn-primary submit px-3" value="Sign In">
    </div>
    <div class="form-group d-md-flex">
    <div class="w-50">
    <label class="checkbox-wrap checkbox-primary">Remember Me
    <input type="checkbox" checked>
    <span class="checkmark"></span>
    </label>
    </div>


    <div class="w-50 text-md-right">
    <a href="{% url 'account:reset_password' %}" style="color: #fff">Forgot Password</a>
    </div>
    </div>


</form>











<p class="w-100 text-center">&mdash; Or Sign In With &mdash;</p>
<div class="social d-flex text-center">
<a href="#" class="px-2 py-2 mr-md-1 rounded"><span class="ion-logo-facebook mr-2"></span> Facebook</a>
<a href="#" class="px-2 py-2 ml-md-1 rounded"><span class="ion-logo-twitter mr-2"></span> Twitter</a>
</div>
</div>
</div>
</div>
</div>
</section>
</body>
</html>
